name: Fork Russian search gate
on:
  workflow_call:
permissions:
  contents: read
jobs:
  search:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    env:
      NODE_OPTIONS: --max-old-space-size=8192
      NIMBALYST_ALLOW_OPENAI_API: '0'
      NIMBALYST_ALLOW_CODEX_ACCESS: '0'
      OPENAI_API_KEY: ''
      ANTHROPIC_API_KEY: ''
      OFFICIAL_BUILD: 'false'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          cache: pnpm
      - name: Install locked application dependencies
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm install --frozen-lockfile
      - name: Verify native Codex with offline model and tool
        run: node scripts/verify-codex-contract.mjs
      - name: Build and typecheck all integrated workspaces
        run: pnpm run typecheck:prepush
      - name: Build Memory and Git extensions
        run: |
          pnpm --dir packages/extensions/nimbalyst-memory run build
          if ($LASTEXITCODE -ne 0) { throw 'Memory build failed' }
          pnpm --dir packages/extensions/git run build
          if ($LASTEXITCODE -ne 0) { throw 'Git extension build failed' }
      - name: Mandatory lexical and hybrid regression tests
        run: pnpm run test:fork-search
      - name: Mandatory portable tracker, editor and discovery regressions
        run: pnpm run test:fork-features
      - name: Mandatory upstream integration regressions
        run: pnpm run test:fork-upstream
      - name: Mandatory annotations, workspace, usage and navigation regressions
        run: pnpm run test:fork-ui
      - name: Mandatory chat, review and workspace routing regressions
        run: >-
          pnpm exec vitest run
          packages/runtime/src/ai/__tests__/chatAnnotations.test.ts
          packages/runtime/src/ai/server/protocols/__tests__/CodexAppServerProtocol.test.ts
          packages/runtime/src/ai/server/transcript/__tests__/CodexAppServerRawParser.test.ts
          packages/runtime/src/ai/server/transcript/__tests__/projectRawMessages.test.ts
          packages/runtime/src/ai/server/transcript/__tests__/TranscriptWriter.test.ts
          packages/runtime/src/ui/AgentTranscript/components/__tests__/RichTranscriptView.turnElapsed.test.tsx
          packages/runtime/src/ui/AgentTranscript/components/__tests__/RichTranscriptView.permissionBanner.test.tsx
          packages/electron/src/main/services/__tests__/SettingsService.test.ts
          packages/runtime/src/ai/server/providers/__tests__/OpenAICodexProvider.test.ts
          packages/runtime/src/editor/markdown/__tests__/MarkdownSource.test.ts
          packages/runtime/src/editor/plugins/CommentPlugin/__tests__/commenterMode.test.tsx
          packages/electron/src/main/__tests__/HistoryManager.multiRoot.test.ts
          packages/electron/src/main/services/ai/__tests__/aiServiceIpcChannels.test.ts
          packages/electron/src/main/services/ai/__tests__/claudeCliInputIntegrationRoundTrip.test.ts
          packages/electron/src/main/tray/__tests__/TrayManager.platform.test.ts
          packages/electron/src/renderer/components/AgentMode/__tests__/AgentReviewPanel.test.tsx
          packages/electron/src/renderer/components/AgentMode/__tests__/SmartCommitOptions.test.tsx
          packages/electron/src/renderer/components/AgentMode/__tests__/temporaryCommitPrompt.test.ts
          packages/electron/src/renderer/components/AgentMode/__tests__/WorkstreamEditorTabs.test.tsx
          packages/electron/src/renderer/components/NavigationGutter/__tests__/usageIndicatorGutterRestore.test.tsx
          packages/electron/src/renderer/components/UnifiedAI/__tests__/AIInput.paste.test.tsx
          packages/electron/src/renderer/components/UnifiedAI/__tests__/ChatAnnotationControls.test.tsx
      - name: Reject OpenAI transcription before opening a socket
        run: pnpm exec vitest run packages/electron/src/main/services/credentials/__tests__/ProviderCredentialVault.test.ts -t "transcription socket"
      - name: Mandatory schema and editor coordination regressions
        run: >-
          pnpm exec vitest run
          packages/tracker-schema/src/__tests__/trackerTypeInheritance.test.ts
          packages/runtime/src/plugins/TrackerPlugin/models/__tests__/builtinsYaml.test.ts
          packages/runtime/src/plugins/TrackerPlugin/models/__tests__/schemaPatch.test.ts
          packages/runtime/src/ai/__tests__/prompt.test.ts
          packages/electron/src/renderer/store/listeners/__tests__/noComponentIpcSubscriptions.test.ts
          packages/electron/src/main/services/__tests__/ElectronDocumentService.planTransition.test.ts
          packages/electron/src/main/services/__tests__/ElectronDocumentService.trackerSync.test.ts
          packages/electron/src/main/services/__tests__/ElectronFileSystemService.test.ts
      - name: Mandatory Stable Git policy and operation regressions
        run: >-
          pnpm exec vitest run
          packages/electron/src/shared/__tests__/extensionChannelPolicy.test.ts
          packages/runtime/src/extensions/__tests__/ExtensionLoader.channelPolicy.test.ts
          packages/runtime/src/extensions/__tests__/ExtensionLoader.settingsRoutes.test.ts
          packages/runtime/src/extensions/__tests__/ExtensionLoader.filesystem.test.ts
          packages/extensions/git/src/__tests__
          packages/electron/src/renderer/store/listeners/__tests__/fileStateListeners.commitSelection.test.ts
          packages/runtime/src/ui/git/__tests__/commitSelection.test.ts
          packages/runtime/src/ui/AgentTranscript/components/__tests__/FileEditsSidebar.commitSelection.test.tsx
          packages/electron/src/main/services/__tests__/GitStatusService.executeGitStatus.test.ts
          packages/electron/src/main/services/__tests__/GitWorktreeService.test.ts
          packages/electron/src/main/services/__tests__/GitCommitService.test.ts
          packages/electron/src/main/services/__tests__/GitCommitService.multiRepo.test.ts
          packages/electron/src/main/ipc/__tests__/GitHandlers.operands.test.ts
          packages/electron/src/main/services/__tests__/GitSyncService.test.ts
          packages/electron/src/main/services/__tests__/GitStatusRefreshCoordinator.test.ts
          packages/electron/src/renderer/services/__tests__/GitStatusObserver.test.ts
          packages/electron/src/renderer/utils/__tests__/gitStatus.test.ts
          packages/electron/src/renderer/components/WindowTopBar/__tests__/WindowTopBar.test.tsx
      - name: Mandatory session file tracking and context regressions
        run: >-
          pnpm exec vitest run
          packages/electron/src/main/services/ai/__tests__/ShellFileAttribution.test.ts
          packages/electron/src/main/services/ai/__tests__/ShellCheckoutBaseline.test.ts
          packages/electron/src/main/services/ai/__tests__/ShellTrackingCoverage.test.ts
          packages/electron/src/main/services/ai/__tests__/codexShellTrackingHost.test.ts
          packages/electron/src/main/services/__tests__/WorkspaceAttributionThrottle.test.ts
          packages/electron/src/renderer/components/AgentMode/__tests__/ShellTrackingNotice.test.tsx
          packages/runtime/src/ai/server/protocols/__tests__/shellTracking.test.ts
      - name: Build isolated Electron application
        run: pnpm --filter @nimbalyst/electron run build
      - name: Build all shipped extensions for app checks
        run: pnpm --filter @nimbalyst/electron run build:extensions
      - name: Verify native runtime
        run: pnpm --filter @nimbalyst/electron run verify:native-runtime
      - name: Mandatory built-app search, Git and file tracker
        run: |
          $env:NIMBALYST_E2E_MAIN_PATH = (Resolve-Path 'packages/electron/out/main/index.js').Path
          $specs = @('codex-model-usage.spec.ts', 'russian-quick-open.spec.ts', 'memory-session-search.spec.ts', 'russian-wiki-search.spec.ts', 'git-stable.spec.ts', 'git-sync.spec.ts', 'attached-folder-search.spec.ts', 'tracker-file-storage.spec.ts', 'forced-sqlite-migration.spec.ts', 'multi-project-rail.spec.ts', 'markdown-source-preservation.spec.ts', 'transcript-activity.spec.ts', 'sidebar-document-context.spec.ts', 'session-edit-batch.spec.ts', 'windows-tray-artwork.spec.ts', 'annotation-drafts.spec.ts')
          foreach ($spec in $specs) {
            pnpm --dir packages/electron exec playwright test $spec --config playwright.search.config.ts
            if ($LASTEXITCODE -ne 0) { throw "Built application regression failed: $spec" }
          }
      - name: Preserve failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: fork-search-diagnostics
          path: |
            e2e_test_output/search-results
            e2e_test_output/search-report
          if-no-files-found: ignore
          retention-days: 7
