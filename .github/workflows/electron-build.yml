name: Windows x64 Release
run-name: Windows x64 - ${{ github.ref_name }}

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-x64-${{ github.ref }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  npm_config_fetch_retries: '5'
  npm_config_fetch_retry_mintimeout: '20000'
  npm_config_fetch_retry_maxtimeout: '120000'
  npm_config_fetch_timeout: '300000'

jobs:
  build:
    name: Build and verify Windows x64
    if: github.repository == 'm4xp1/nimbalyst'
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    env:
      NODE_OPTIONS: --max-old-space-size=8192
      BUILD_ARCH: x64
      BUILD_PLATFORM: win32
      ALLOW_UNSIGNED_WINDOWS_BUILD: 'true'
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      OFFICIAL_BUILD: 'false'
    steps:
      - name: Checkout exact branch or tag
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - name: Verify release branch and version
        run: |
          git merge-base --is-ancestor HEAD origin/release
          if ($LASTEXITCODE -ne 0) { throw 'This commit does not belong to the release branch' }
          $version = (Get-Content packages/electron/package.json -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            if ($env:GITHUB_REF_NAME -ne "v$version") { throw "Tag does not match Electron version $version" }
          } elseif ($env:GITHUB_REF -ne 'refs/heads/release') {
            throw 'Manual validation must use the release branch'
          }
          "Source: $(git rev-parse HEAD); Electron: $version; platform: Windows x64"

      - name: Setup Node.js 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: '**/package-lock.json'

      - name: Use npm 11
        run: npm install --global npm@11

      - name: Install locked dependencies
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm ci

      - name: Build workspace dependencies
        run: npm run build:workspace-deps

      - name: Build runtime assets
        env:
          NODE_ENV: production
        run: npm run build --workspace=@nimbalyst/runtime

      - name: Build Node package
        run: npm run build --workspace=@nimbalyst/node

      - name: Build memory engine declarations
        run: npm run build --prefix packages/extensions/nimbalyst-memory/engine

      - name: Typecheck all workspaces
        run: npm run typecheck

      - name: Test fork features
        run: >-
          npx vitest run
          packages/electron/src/main/services/__tests__/autoUpdater.channelPolicy.test.ts
          packages/electron/src/renderer/store/atoms/__tests__/fileTree.visibleNodes.test.ts
          packages/electron/src/renderer/components/common/__tests__/FilePathBreadcrumb.test.tsx
          packages/electron/src/renderer/components/TrackerMode/__tests__/TrackerItemDetail.fields.test.tsx
          packages/electron/src/renderer/services/document-model/__tests__/DocumentModel.test.ts
          packages/electron/src/renderer/services/document-model/__tests__/DocumentModelRegistry.test.ts
          packages/electron/src/renderer/components/TabEditor/__tests__/resolveSaveAttempt.test.ts
          packages/extensions/nimbalyst-memory/engine/src/__tests__
          packages/extensions/nimbalyst-memory/src/__tests__

      - name: Verify fork SemVer and Windows revision
        run: node --test packages/electron/build/__tests__/forkVersion.test.cjs

      - name: Verify native modules in the pinned Electron runtime
        run: npm run verify:native-runtime --workspace=@nimbalyst/electron

      - name: Build Windows x64 installer
        env:
          NODE_ENV: production
        working-directory: packages/electron
        run: npm run build:win -- --publish never --config.publish.owner=m4xp1 --config.publish.repo=nimbalyst

      - name: Verify installer and record SHA-256
        run: |
          $package = Get-Content packages/electron/package.json -Raw | ConvertFrom-Json
          $application = Get-Item 'packages/electron/release/win-unpacked/Nimbalyst.exe'
          if ($application.VersionInfo.FileVersion -ne $package.build.buildVersion) {
            throw "Windows application FileVersion mismatch: $($application.VersionInfo.FileVersion)"
          }
          node -e "const fs=require('fs'); const asar=require('@electron/asar'); const expected=JSON.parse(fs.readFileSync('packages/electron/package.json','utf8')).version; const actual=JSON.parse(asar.extractFile('packages/electron/release/win-unpacked/resources/app.asar','package.json').toString()).version; if(actual!==expected) throw new Error('Packaged app version mismatch: '+actual); console.log('Packaged version: '+actual)"
          if ($LASTEXITCODE -ne 0) { throw 'Packaged version validation failed' }
          $installer = Get-Item 'packages/electron/release/Nimbalyst-Windows-x64.exe'
          "Application FileVersion: $($application.VersionInfo.FileVersion); installer FileVersion: $($installer.VersionInfo.FileVersion); ProductVersion: $($installer.VersionInfo.ProductVersion)"
          if ($installer.Length -lt 1MB) { throw 'Installer is unexpectedly small' }
          $stream = $installer.OpenRead()
          try {
            if ($stream.ReadByte() -ne 0x4D -or $stream.ReadByte() -ne 0x5A) { throw 'Installer is not a Windows executable' }
          } finally { $stream.Dispose() }
          $hash = (Get-FileHash -LiteralPath $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $($installer.Name)" | Set-Content 'packages/electron/release/SHA256SUMS.txt' -Encoding ascii
          $signature = (Get-AuthenticodeSignature -LiteralPath $installer.FullName).Status
          "Installer: $($installer.Name); bytes: $($installer.Length); SHA256: $hash; signature: $signature"
          if ($signature -ne 'NotSigned') { throw "Expected an unsigned fork installer, got $signature" }
          @"
          ## Windows x64 build
          - Source commit: $(git rev-parse HEAD)
          - Installer: $($installer.Name) ($($installer.Length) bytes)
          - SHA-256: $hash
          - Authenticode: $signature
          - Checks: workspace typecheck, fork regression tests, Electron native runtime, packaging validators
          "@ | Add-Content $env:GITHUB_STEP_SUMMARY

      - name: Upload verified installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-x64
          path: |
            packages/electron/release/Nimbalyst-Windows-x64.exe
            packages/electron/release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish Windows x64 GitHub Release
    needs: build
    if: github.ref_type == 'tag'
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout release tag
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Download verified installer
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: windows-x64
          path: release-assets

      - name: Publish release with installer and checksum
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          @"
          Nimbalyst $tag for Windows x64, built from the release branch of m4xp1/nimbalyst.

          Based on upstream v0.79.1. Fork version: 0.79.1+m4xp1.1; Windows revision: 0.79.1.1.
          - Removed the FILES target button; filename breadcrumbs still reveal/select the file.
          - Folder breadcrumb menus support browsing, parent navigation and keyboard controls.
          - Linked Markdown in tracker CONTENT uses the shared editable document, including file saving.
          - Unicode/Russian BM25 and recall; existing lexical terms migrate without re-embedding.
          - Per-project additional Markdown sources with preview, exclusions and live discovery.
          - Memory distinguishes partial indexes, persisted chunks, embeddings, errors and file watching.
          - Refresh reads status only; Rebuild reuses unchanged embeddings.
          - Official upstream update notifications remain enabled; automatic download/install are disabled.
          - No retry/backoff, query cache, model change or promise to persist new text after embedding failure.

          Post-install acceptance: docs/FORK-SEARCH-ACCEPTANCE-v0.79.1-m4xp1.1.md in this tag.
          Installed GUI and live OpenAI search require post-install acceptance; CI uses fake providers.

          Source commit: $env:GITHUB_SHA
          Installer: Nimbalyst-Windows-x64.exe
          Authenticode: unsigned (no Nimbalyst/DigiCert signing credentials used).
          Checks: workspace typecheck, fork regression tests, Electron native runtime and packaging validation.
          Other operating systems and Windows ARM64 are not built.
          Use SHA256SUMS.txt to verify the download. Updates are installed manually for this unsigned fork.
          "@ | Set-Content release-assets/RELEASE_NOTES.md -Encoding utf8
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag release-assets/Nimbalyst-Windows-x64.exe release-assets/SHA256SUMS.txt --repo $env:GITHUB_REPOSITORY --clobber
            if ($LASTEXITCODE -ne 0) { throw 'Release asset upload failed' }
          } else {
            gh release create $tag release-assets/Nimbalyst-Windows-x64.exe release-assets/SHA256SUMS.txt --repo $env:GITHUB_REPOSITORY --verify-tag --target release --title "Nimbalyst $tag - Windows x64 (fork)" --notes-file release-assets/RELEASE_NOTES.md --latest
            if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
          }
